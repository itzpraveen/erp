services:
  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - erp-network
    # Add command to optimize cache size and prevent memory issues
    command: ["--wiredTigerCacheSizeGB", "1"]

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/solar-erp
      - JWT_SECRET=erp-secret-key-development
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: always
    networks:
      - erp-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    ports:
      - "3002:3001"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: always
    environment:
      - REACT_APP_API_URL=http://erp-backend:5001
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local