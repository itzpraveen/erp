services:
  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - erp-network
    # Add command to optimize cache size and prevent memory issues
    command: ["--wiredTigerCacheSizeGB", "1"]

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    # Note: removed direct exposure of port since we'll use nginx to proxy
    expose:
      - "5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/erp
      - JWT_SECRET=${JWT_SECRET:-erp-secret-key-development}
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: always
    networks:
      - erp-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    # Note: removed direct exposure of port since we'll use nginx to proxy
    expose:
      - "3001"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: always
    networks:
      - erp-network
  
  # Nginx Service for routing
  nginx:
    image: nginx:alpine
    container_name: erp-nginx
    ports:
      - "3002:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local