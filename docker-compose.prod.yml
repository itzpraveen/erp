services:
  # MongoDB Service with authentication
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      # Add volume for automated backups
      - ./mongo-backups:/backups
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=solar-erp
    # Add command to optimize cache size and prevent memory issues
    command: ["--wiredTigerCacheSizeGB", "1", "--auth"]
    networks:
      - erp-network

  # Redis for caching and session management
  redis:
    image: redis:alpine
    container_name: erp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - erp-network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: erp-backend
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/solar-erp
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_SOURCE=admin
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URI=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - mongodb
      - redis
    restart: always
    networks:
      - erp-network

  # Scheduled backup service
  backup:
    image: mongo:latest
    depends_on:
      - mongodb
    volumes:
      - ./mongo-backups:/backups
      - ./scripts:/scripts
    entrypoint: "/bin/bash"
    command: ["/scripts/backup.sh"]
    restart: unless-stopped
    networks:
      - erp-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: erp-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - erp-network

  # Nginx Service for reverse proxy and SSL
  nginx:
    image: nginx:latest
    container_name: erp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local