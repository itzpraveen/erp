[build]
builder = "nixpacks"
buildCommand = "npm install && cd frontend && npm install && npm run build && cd ../backend && npm install"

[deploy]
startCommand = "node backend/src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
healthcheckInterval = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
CI = "false"

# Never define sensitive values like passwords or secrets here!
# Use Railway's environment variables UI instead